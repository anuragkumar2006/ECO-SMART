{% extends 'base.html' %}

{% block title %}Prediction History — EcoSmart{% endblock %}

{% block content %}
<div class="space-y-8 py-4">
    <!-- Header & Filter Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Prediction History</h1>
            <p class="text-sm text-slate-500">Review all your previous AI waste classifications and recommendations</p>
        </div>

        <!-- Filters -->
        <div class="flex items-center gap-2">
            <button onclick="filterHistory('all')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active-filter" data-cat="all">
                All
            </button>
            <button onclick="filterHistory('organic')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-cat="organic">
                Organic
            </button>
            <button onclick="filterHistory('recyclable')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-cat="recyclable">
                Recyclable
            </button>
            <button onclick="filterHistory('hazardous')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" data-cat="hazardous">
                Hazardous
            </button>
        </div>
    </div>

    <!-- History Grid -->
    <div id="history-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-12 bg-white rounded-3xl border border-slate-100 card-shadow text-slate-400 text-sm">
            Loading prediction history...
        </div>
    </div>
</div>

<script>
    let allPredictions = [];

    document.addEventListener('DOMContentLoaded', async () => {
        fetchHistory();
    });

    async function fetchHistory(category = '') {
        const token = getAuthToken();
        if (!token) return;

        let url = '/api/predictions/';
        if (category && category !== 'all') {
            url += `?category=${category}`;
        }

        try {
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                allPredictions = data.results || data;
                renderHistoryGrid(allPredictions);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function filterHistory(cat) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.getAttribute('data-cat') === cat) {
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                btn.classList.remove('bg-white', 'text-slate-700');
            } else {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                btn.classList.add('bg-white', 'text-slate-700');
            }
        });

        fetchHistory(cat);
    }

    function renderHistoryGrid(items) {
        const grid = document.getElementById('history-grid');

        if (!items || items.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-100 card-shadow space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 mx-auto flex items-center justify-center">
                        <i data-lucide="inbox" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-800">No predictions found</h3>
                        <p class="text-xs text-slate-400 mt-1">Start scanning waste items to build your history log.</p>
                    </div>
                    <a href="/app/scan/" class="inline-flex px-5 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md">
                        Scan Item Now
                    </a>
                </div>
            `;
            lucide.createIcons();
            return;
        }

        grid.innerHTML = items.map(p => `
            <div class="bg-white rounded-3xl border border-slate-100 card-shadow overflow-hidden flex flex-col justify-between hover:shadow-lg transition-all group">
                <div class="relative bg-slate-900 h-48 overflow-hidden">
                    <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    <div class="absolute top-3 left-3">
                        <span class="px-3 py-1 rounded-full text-xs font-bold capitalize shadow-md ${
                            p.category === 'organic' ? 'bg-emerald-500 text-white' :
                            p.category === 'recyclable' ? 'bg-blue-500 text-white' : 'bg-amber-500 text-white'
                        }">
                            ${p.category}
                        </span>
                    </div>
                    <div class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">
                        ${p.confidence_percentage}% confidence
                    </div>
                </div>

                <div class="p-6 space-y-4">
                    <div class="space-y-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Recommended Bin</span>
                        <h4 class="text-base font-bold text-slate-900 flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${p.bin_color_code};"></span>
                            ${p.bin_type}
                        </h4>
                    </div>

                    <p class="text-xs text-slate-500 line-clamp-2">${p.recommendation_text}</p>

                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                        <span class="text-slate-400">${new Date(p.created_at).toLocaleDateString()}</span>
                        <a href="/app/result/${p.id}/" class="font-bold text-blue-600 hover:underline flex items-center gap-1">
                            Details &rarr;
                        </a>
                    </div>
                </div>
            </div>
        `).join('');

        lucide.createIcons();
    }
</script>
{% endblock %}
