{% extends 'base.html' %}

{% block title %}Create Account — EcoSmart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white p-8 rounded-3xl border border-slate-100 card-shadow space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-slate-900">Create EcoSmart Account</h2>
            <p class="text-sm text-slate-500">Start tracking & segregating your waste with AI</p>
        </div>

        <form id="register-form" class="space-y-4" onsubmit="handleRegisterSubmit(event)">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="user@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" required minlength="6" placeholder="Repeat password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all text-sm flex items-center justify-center gap-2">
                Register & Continue
            </button>
        </form>

        <div class="text-center pt-2 text-xs text-slate-500">
            Already have an account? <a href="/login/" class="text-blue-600 font-bold hover:underline">Sign In</a>
        </div>
    </div>
</div>

<script>
    async function handleRegisterSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (password !== confirm_password) {
            showToast('Passwords do not match.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Registering...`;
        lucide.createIcons();

        try {
            const res = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, confirm_password })
            });

            const data = await res.json();
            if (res.ok) {
                showToast('Registration successful! Please sign in.', 'success');
                setTimeout(() => { window.location.href = '/login/'; }, 600);
            } else {
                const err = data.email?.[0] || data.password?.[0] || 'Registration failed.';
                showToast(err, 'error');
                btn.disabled = false;
                btn.textContent = 'Register & Continue';
            }
        } catch (err) {
            showToast('Network error while registering.', 'error');
            btn.disabled = false;
            btn.textContent = 'Register & Continue';
        }
    }
</script>
{% endblock %}
