<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoSmart — AI Waste Segregation & Analytics{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            500: '#3B82F6',
                            600: '#1B47DB',
                            700: '#1D4ED8',
                            900: '#1E293B',
                        },
                        surface: {
                            bg: '#F7F8FA',
                            card: '#FFFFFF',
                            text: '#232E32',
                            muted: '#64748B',
                        },
                        waste: {
                            organic: '#2E8B57',
                            recyclable: '#3B82F6',
                            hazardous: '#B45309',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F7F8FA;
            color: #232E32;
            font-family: 'Inter', sans-serif;
        }
        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Desktop Sidebar -->
    <aside id="sidebar" class="w-full md:w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col justify-between hidden md:flex min-h-screen sticky top-0">
        <div>
            <!-- Brand Logo -->
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 to-emerald-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i data-lucide="leaf" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-900 tracking-tight">EcoSmart</h1>
                    <p class="text-xs text-slate-400 font-medium">AI Segregation Platform</p>
                </div>
            </div>

            <!-- Primary Navigation Links -->
            <nav class="p-4 space-y-1">
                <a href="/app/dashboard/" class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-all" data-page="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Dashboard
                </a>
                <a href="/app/scan/" class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition-all" data-page="scan">
                    <i data-lucide="scan" class="w-5 h-5"></i>
                    Scan Waste
                </a>
                <a href="/app/history/" class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-all" data-page="history">
                    <i data-lucide="history" class="w-5 h-5"></i>
                    History
                </a>
                <a href="/app/analytics/" class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-all" data-page="analytics">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    Analytics
                </a>
                <a href="/app/profile/" class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-all" data-page="profile">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    Profile
                </a>
            </nav>
        </div>

        <!-- User / Auth Profile Widget -->
        <div class="p-4 border-t border-slate-100">
            <div id="user-nav-widget" class="flex items-center justify-between p-3 rounded-xl bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-sm" id="user-avatar-initials">
                        U
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-xs font-bold text-slate-800 truncate" id="user-name-display">Guest User</p>
                        <p class="text-[10px] text-slate-500 truncate" id="user-email-display">Not logged in</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-600 transition-colors p-1" title="Logout">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Mobile Top Navigation Bar -->
    <header class="md:hidden bg-white border-b border-slate-200 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-700 to-emerald-500 flex items-center justify-center text-white">
                <i data-lucide="leaf" class="w-4 h-4"></i>
            </div>
            <span class="font-bold text-lg text-slate-900 tracking-tight">EcoSmart</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="/app/scan/" class="px-3 py-1.5 text-xs font-bold bg-blue-600 text-white rounded-lg flex items-center gap-1.5">
                <i data-lucide="scan" class="w-3.5 h-3.5"></i> Scan
            </a>
            <button onclick="toggleMobileMenu()" class="p-2 text-slate-600 hover:text-slate-900">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 py-3 space-y-2">
        <a href="/app/dashboard/" class="block px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">Dashboard</a>
        <a href="/app/scan/" class="block px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">Scan Waste</a>
        <a href="/app/history/" class="block px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">History</a>
        <a href="/app/analytics/" class="block px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">Analytics</a>
        <a href="/app/profile/" class="block px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg">Profile</a>
        <button onclick="handleLogout()" class="block w-full text-left px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50 rounded-lg">Logout</button>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm"></div>

        {% block content %}{% endblock %}
    </main>

    <script>
        lucide.createIcons();

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        // Global Auth state manager
        function getAuthToken() {
            return localStorage.getItem('ecosmart_access_token');
        }

        function getUserInfo() {
            const userStr = localStorage.getItem('ecosmart_user');
            return userStr ? JSON.parse(userStr) : null;
        }

        function updateUIAuthWidget() {
            const user = getUserInfo();
            const widgetName = document.getElementById('user-name-display');
            const widgetEmail = document.getElementById('user-email-display');
            const widgetAvatar = document.getElementById('user-avatar-initials');

            if (user) {
                if (widgetName) widgetName.textContent = user.name || 'Eco User';
                if (widgetEmail) widgetEmail.textContent = user.email;
                if (widgetAvatar) widgetAvatar.textContent = (user.name || user.email).charAt(0).toUpperCase();
            } else {
                // If on app routes without token, redirect to login
                const currentPath = window.location.pathname;
                if (currentPath.startsWith('/app/')) {
                    window.location.href = '/login/';
                }
            }
        }

        function handleLogout() {
            localStorage.removeItem('ecosmart_access_token');
            localStorage.removeItem('ecosmart_refresh_token');
            localStorage.removeItem('ecosmart_user');
            showToast('Logged out successfully', 'info');
            setTimeout(() => { window.location.href = '/login/'; }, 500);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-900 text-white';
            if (type === 'error') bgClass = 'bg-rose-600 text-white';
            if (type === 'success') bgClass = 'bg-emerald-600 text-white';
            if (type === 'warning') bgClass = 'bg-amber-600 text-white';

            toast.className = `p-4 rounded-xl shadow-xl ${bgClass} text-sm font-semibold flex items-center justify-between gap-4 transition-all transform duration-300 translate-y-0 opacity-100`;
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100">&times;</button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Initialize Icons & Auth state
        document.addEventListener('DOMContentLoaded', () => {
            updateUIAuthWidget();
            
            // Highlight active nav item
            const path = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(link => {
                const page = link.getAttribute('data-page');
                if (path.includes(page) && page !== 'scan') {
                    link.classList.add('bg-slate-100', 'text-blue-600');
                    link.classList.remove('text-slate-600');
                }
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
